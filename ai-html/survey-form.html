<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
</head>
<body>

    <h1>Survey Form</h1>
    <p>Let us know how we can improve freeCodeCamp</p>

    <form action="#">

        <div>
            <label for="name">* Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <br>

        <div>
            <label for="email">* Email:</label>
            <input type="email" id="email" placeholder="Enter your Email" required>
        </div>

        <br>

        <div>
            <label for="age">* Age:</label>
            <input type="number" id="age" placeholder="Age" min="1" max="120" required>
        </div>

        <br>

        <div>
            <label for="role">Which option best describes your current role?</label>
            <select id="role">
                <option value="student">Student</option>
                <option value="job">Full Time Job</option>
                <option value="learner">Full Time Learner</option>
                <option value="preferNo">Prefer not to say</option>
                <option value="other">Other</option>
            </select>
        </div>

        <br>

        <div>
            <p>* How likely is that you would recommend freeCodeCamp to a friend?</p>
            
            <input type="radio" id="definitely" name="recommend" value="definitely">
            <label for="definitely">Definitely</label>
            
            <br>
            
            <input type="radio" id="maybe" name="recommend" value="maybe">
            <label for="maybe">Maybe</label>
            
            <br>
            
            <input type="radio" id="not-sure" name="recommend" value="not-sure">
            <label for="not-sure">Not sure</label>
        </div>

        <br>

        <div>
            <label for="most-liked">What do you like most in FCC:</label>
            <select id="most-liked">
                <option value="" disabled selected>Select an option</option>
                <option value="challenges">Challenges</option>
                <option value="projects">Projects</option>
                <option value="community">Community</option>
                <option value="open-source">Open Source</option>
            </select>
        </div>

        <br>

        <div>
            <p>Things that should be improved in the future (Check all that apply):</p>
            
            <input type="checkbox" id="front-end" value="front-end">
            <label for="front-end">Front-end Projects</label>
            
            <br>
            
            <input type="checkbox" id="back-end" value="back-end">
            <label for="back-end">Back-end Projects</label>
            
            <br>
            
            <input type="checkbox" id="data-visualization" value="data-visualization">
            <label for="data-visualization">Data Visualization</label>
        </div>

        <br>

        <div>
            <button type="submit">Submit</button>
        </div>

    </form>

</body>
</html>
